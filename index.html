<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mec.com</title>
<style>
  body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffd6e8;
    font-family:Arial,sans-serif;
  }

  .card {
    background:white;
    padding:35px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    max-width:400px;
    position:relative;
  }

  .card img {
    width:150px;
    border-radius:50%;
    margin-bottom:15px;
  }
  .card h1 {
    margin:0;
    font-size:24px;
    color:gray;
  }
  .card p {
    margin:10px 0 0;
    color:gray;
  }
  input {
    padding:10px;
    width:80%;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ccc;
  }

  button {
    background:#ff6b81;
    border:none;
    padding:10px 20px;
    color:white;
    border-radius:12px;
    cursor:pointer;
    margin-top:15px;
    font-size:16px;
  }
  button:hover { background:#ff3b5f; }

  .hidden { display:none; color:red; margin-top:10px; }
</style>
</head>
<body>
<div class="card">

  <img src="baby4.jpg" alt="Our Love Photo">

  <h1>Happy Valentines bibi!</h1>
  <p>enter mo po name mo sa pass hehe</p>
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button id="loginBtn">Enter</button>
  <p id="error" class="hidden">Oops! Wrong password 💕</p>

<audio id="bgMusic" src="always.mp3" preload="auto" loop></audio>
</div>

<script>
  const loginBtn = document.getElementById("loginBtn");
  const passwordInput = document.getElementById("passwordInput");
  const error = document.getElementById("error");

  loginBtn.addEventListener("click", () => {
    if(passwordInput.value.trim() === "stacey"){
        window.location.href = "valentine.html";
    } else {
      error.classList.remove("hidden");
    }
  });

const music = document.getElementById("bgMusic");

// Load last position
const lastTime = localStorage.getItem("musicTime");
if (lastTime) music.currentTime = lastTime;

// Allow start on first tap
document.addEventListener("click", function startOnce() {
    music.play();
    document.removeEventListener("click", startOnce);
});

// Save time every 500ms
setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 500);
</script>
</body>
</html>
